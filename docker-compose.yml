version: "3.9"

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - "8001:8000"

    environment:
      DATABASE_URL: postgresql://postgres:root@host.containers.internal:5432/talentos
      APP_ENV: development
      LOG_LEVEL: INFO
      SUPABASE_FUNCTIONS_BASE_URL: https://cohqewhcplvohyjxpyoc.supabase.co/functions/v1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      AI_SERVICE_BASE_URL: http://host.containers.internal:8080

    command: >
      sh -c "
        alembic upgrade head &&
        python3 -m seed.run_seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_started

    environment:
      DATABASE_URL: postgresql://postgres:root@host.containers.internal:5432/talentos
      APP_ENV: development
      LOG_LEVEL: INFO
      SUPABASE_FUNCTIONS_BASE_URL: https://cohqewhcplvohyjxpyoc.supabase.co/functions/v1
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      AI_SERVICE_BASE_URL: http://host.containers.internal:8080

    command: python3 -m app.workers.evaluation_worker
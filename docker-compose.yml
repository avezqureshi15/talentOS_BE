services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/talentos
      APP_ENV: development
      LOG_LEVEL: INFO
      SUPABASE_FUNCTIONS_BASE_URL: https://cohqewhcplvohyjxpyoc.supabase.co/functions/v1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # Hardcoded (not ${...}) so the .env localhost value can't leak into the
      # container, where localhost would point at the container itself.
      AI_SERVICE_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        alembic upgrade head &&
        python3 -m seed.run_seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/talentos
      APP_ENV: development
      LOG_LEVEL: INFO
      SUPABASE_FUNCTIONS_BASE_URL: https://cohqewhcplvohyjxpyoc.supabase.co/functions/v1
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      AI_SERVICE_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 -m app.workers.evaluation_worker

volumes:
  pgdata:

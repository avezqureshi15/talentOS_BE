# Uses Supabase cloud DB (no local postgres).
#   docker compose up -d --build
# API: http://localhost:8001  |  Kafka: :9092

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:4173}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_EVALUATION_ASYNC: ${KAFKA_TOPIC_EVALUATION_ASYNC:-resume.evaluation.async}
      KAFKA_TOPIC_EVALUATION_ASYNC_DLQ: ${KAFKA_TOPIC_EVALUATION_ASYNC_DLQ:-resume.evaluation.async.dlq}
      KAFKA_EVALUATION_PARTITIONS: ${KAFKA_EVALUATION_PARTITIONS:-6}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://host.docker.internal:8003}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-60}
      ATS_THRESHOLD_DEFAULT: ${ATS_THRESHOLD_DEFAULT:-70}
      EVALUATION_MAX_ATTEMPTS: ${EVALUATION_MAX_ATTEMPTS:-3}
      EVALUATION_MIN_RESUME_CHARS: ${EVALUATION_MIN_RESUME_CHARS:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "
        alembic stamp head 2>/dev/null;
        alembic upgrade head 2>/dev/null;
        
        python3 -m seed.run_seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8001
      "

  console:
    image: redpandadata/console:v2.7.2
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      CONSOLE_ACCESS_TYPE: public
    ports:
      - "8080:8080"

  worker-full:
    build: .
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      app:
        condition: service_started
    deploy:
      replicas: 3
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:4173}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_EVALUATION_ASYNC: ${KAFKA_TOPIC_EVALUATION_ASYNC:-resume.evaluation.async}
      KAFKA_TOPIC_EVALUATION_ASYNC_DLQ: ${KAFKA_TOPIC_EVALUATION_ASYNC_DLQ:-resume.evaluation.async.dlq}
      KAFKA_EVALUATION_PARTITIONS: ${KAFKA_EVALUATION_PARTITIONS:-6}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://host.docker.internal:8003}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-60}
      ATS_THRESHOLD_DEFAULT: ${ATS_THRESHOLD_DEFAULT:-70}
      EVALUATION_MAX_ATTEMPTS: ${EVALUATION_MAX_ATTEMPTS:-3}
      EVALUATION_MIN_RESUME_CHARS: ${EVALUATION_MIN_RESUME_CHARS:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 -m app.workers.evaluation_full_worker
